name: Update US stock calendar

on:
  schedule:
    # 06:30 เวลาไทย จันทร์–ศุกร์ (= 23:30 UTC อาทิตย์–พฤหัส) หลังตลาดสหรัฐปิด
    - cron: "30 23 * * 0-4"
  workflow_dispatch: {}   # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build .ics
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python build_calendar.py
      - name: Commit
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add docs/us-stocks.ics data/reactions.json
          git diff --cached --quiet || git commit -m "update calendar $(date -u +%F)"
          git push
